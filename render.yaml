services:
  - type: web
    name: marshal-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: LOG_FORMAT
        value: json
      - key: ALLOWED_ORIGIN
        value: "https://marshal-admin.vercel.app,https://marshal-student.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: marshal-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DRIVER_GROUP_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: DRIVER_PRESENCE_TTL_MINUTES
        value: "15"
    healthCheckPath: /healthz

databases:
  - name: marshal-db
    plan: free
    databaseName: marshal_db
    user: marshal
