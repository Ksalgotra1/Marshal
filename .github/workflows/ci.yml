name: Marshal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
      - name: Run go vet
        working-directory: backend
        run: go vet ./...

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marshal_test
          POSTGRES_PASSWORD: marshal_test_secret
          POSTGRES_DB: marshal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      MARSHAL_TEST_DATABASE_URL: postgres://marshal_test:marshal_test_secret@localhost:5432/marshal_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Unit tests
        working-directory: backend
        run: go test -race -p 1 ./...

      - name: Integration tests
        working-directory: backend
        run: go test -tags=integration -race -count=1 -p 1 -timeout 180s ./...

      - name: Coverage check (threshold 40%)
        working-directory: backend
        run: |
          set -euo pipefail
          go test -coverprofile=coverage.out -tags=integration -count=1 -p 1 ./internal/...
          grep -v -E "github.com/Ksalgotra1/Marshal/(cmd|internal/api|internal/config)" \
            coverage.out > coverage_filtered.out
          COVERAGE=$(go tool cover -func=coverage_filtered.out | grep "^total:" | awk '{print $NF}' | tr -d '%')
          echo "Filtered coverage: ${COVERAGE}%  (threshold: 40%)"
          if [ $(echo "${COVERAGE} < 40" | bc -l) -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 40% threshold"
            exit 1
          fi

  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
      - name: Build binary
        working-directory: backend
        run: go build -o bin/marshal ./cmd/marshal
      - name: Build Docker image
        run: docker build -t marshal-backend ./backend

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        app: [admin, student]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Install and build
        working-directory: frontend/${{ matrix.app }}
        run: |
          npm ci
          npm run build
